logging:
  level: INFO

embedding:
  model_name: jinaai/jina-embeddings-v3
  trust_remote_code: true
  batch_size: 4
  max_length: 4096
  normalize_newlines: true

paths:
  input_dir: data/articles
  output_h5: outputs/articles.h5
  clusters_output: outputs/clusters.csv
  run_metadata_output: outputs/run_metadata.json
  visualization_html: outputs/umap_3d.html

reduction:
  method: umap
  n_components: 12
  n_neighbors: 15
  min_dist: 0.1
  metric: cosine
  random_state: 42

visualization_reduction:
  method: umap
  n_components: 3
  n_neighbors: 15
  min_dist: 0.1
  metric: cosine
  random_state: 42

clustering:
  method: hdbscan
  dbscan:
    eps: 0.5
    min_samples: 5
    metric: euclidean
  hdbscan:
    min_cluster_size: 12
    min_samples: 5
    metric: euclidean

visualization:
  color_by: source
  marker_size: 4
  opacity: 0.75
  title: UMAP 3D Embeddings
