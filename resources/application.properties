# NewsMap Spring Boot Configuration
server.port=8080
spring.application.name=NewsMap
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Scan source listing pages every two hours (UTC). Previously fetched canonical URLs
# are rejected by data/crawl-ledger.db before their article pages are downloaded.
newsmap.pipeline.cron=${NEWSMAP_PIPELINE_CRON:0 0 */2 * * *}
newsmap.pipeline.zone=UTC
newsmap.pipeline.max-articles-per-source=100

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d

# Enable secure cookies on a public HTTPS backend/reverse proxy.
server.servlet.session.cookie.secure=${NEWSMAP_SECURE_COOKIES:false}
server.forward-headers-strategy=framework

newsmap.cors.allowed-origins=${NEWSMAP_FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
newsmap.pipeline.enabled=${NEWSMAP_PIPELINE_ENABLED:true}
