# NewsMap Spring Boot Configuration
server.port=8080
spring.application.name=NewsMap
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Scan source listing pages every 15 minutes. Previously fetched canonical URLs
# are rejected by data/crawl-ledger.db before their article pages are downloaded.
newsmap.pipeline.cron=0 */15 * * * *
newsmap.pipeline.max-articles-per-source=100

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d
